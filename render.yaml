# Render "Blueprint": creates the API + a PostgreSQL database in one go.
# Dashboard -> New -> Blueprint -> pick your GitHub repo.
services:
  - type: web
    name: vulnsight-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt psycopg2-binary
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: vulnsight-db
          property: connectionString
      - key: FRONTEND_URLS
        sync: false          # you type your Vercel URL here in the dashboard
      - key: ALLOW_PRIVATE_TARGETS
        value: "false"       # never true on a public server

databases:
  - name: vulnsight-db
    plan: free
